<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 576" width="1200" height="576" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" role="img" aria-label="Path of a request through QAF and levels N0 to N4"><title>Path of a request through QAF and levels N0 to N4</title><rect width="1200" height="576" rx="20" fill="#131217"/><g transform="translate(0,-64)"><rect x="40" y="108" width="208" height="128" rx="12" fill="#25222D" stroke="#353140" stroke-width="1"/><circle cx="66" cy="136" r="13" fill="#1C1A22" stroke="#9D7BF4" stroke-width="1.5"/><text x="66" y="141" font-size="13" fill="#EEECF3" font-weight="700" text-anchor="middle">1</text><text x="88" y="141" font-size="15" fill="#EEECF3" font-weight="650" text-anchor="start">You ask</text><text x="56" y="178" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">“make me a Debian dev</text><text x="56" y="198" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">qube with git”</text><text x="56" y="224" font-size="13" fill="#C4B5FD" font-weight="600" text-anchor="start">palette, internal keyboard</text><path d="M251 172 L266 172" stroke="#9D7BF4" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M259.0 175.8 L266 172 L259.0 168.2" stroke="#9D7BF4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="270" y="108" width="208" height="128" rx="12" fill="#25222D" stroke="#353140" stroke-width="1"/><circle cx="296" cy="136" r="13" fill="#1C1A22" stroke="#9D7BF4" stroke-width="1.5"/><text x="296" y="141" font-size="13" fill="#EEECF3" font-weight="700" text-anchor="middle">2</text><text x="318" y="141" font-size="15" fill="#EEECF3" font-weight="650" text-anchor="start">Agent makes a plan</text><text x="286" y="178" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">50 typed operations</text><text x="286" y="198" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">(vm.create, pkg.install…)</text><text x="286" y="224" font-size="13" fill="#C4B5FD" font-weight="600" text-anchor="start">unknown field = refused</text><path d="M481 172 L496 172" stroke="#9D7BF4" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M489.0 175.8 L496 172 L489.0 168.2" stroke="#9D7BF4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="108" width="208" height="128" rx="12" fill="#25222D" stroke="#9D7BF4" stroke-width="1.5"/><circle cx="526" cy="136" r="13" fill="#75507B" stroke="#9D7BF4" stroke-width="1.5"/><text x="526" y="141" font-size="13" fill="#EEECF3" font-weight="700" text-anchor="middle">3</text><text x="548" y="141" font-size="15" fill="#EEECF3" font-weight="650" text-anchor="start">Doorman classifies</text><text x="516" y="178" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">severity N0-N4</text><text x="516" y="198" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">× influence × scope</text><text x="516" y="224" font-size="13" fill="#C4B5FD" font-weight="600" text-anchor="start">in dom0, no LLM</text><path d="M711 172 L726 172" stroke="#9D7BF4" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M719.0 175.8 L726 172 L719.0 168.2" stroke="#9D7BF4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="730" y="108" width="208" height="128" rx="12" fill="#25222D" stroke="#353140" stroke-width="1"/><circle cx="756" cy="136" r="13" fill="#1C1A22" stroke="#9D7BF4" stroke-width="1.5"/><text x="756" y="141" font-size="13" fill="#EEECF3" font-weight="700" text-anchor="middle">4</text><text x="778" y="141" font-size="15" fill="#EEECF3" font-weight="650" text-anchor="start">Decision</text><text x="746" y="178" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">auto, confirmation,</text><text x="746" y="198" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">reinforced or refused</text><text x="746" y="224" font-size="13" fill="#6E6A7A" font-weight="600" text-anchor="start">see below</text><path d="M941 172 L956 172" stroke="#9D7BF4" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M949.0 175.8 L956 172 L949.0 168.2" stroke="#9D7BF4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="960" y="108" width="208" height="128" rx="12" fill="#25222D" stroke="#353140" stroke-width="1"/><circle cx="986" cy="136" r="13" fill="#1C1A22" stroke="#9D7BF4" stroke-width="1.5"/><text x="986" y="141" font-size="13" fill="#EEECF3" font-weight="700" text-anchor="middle">5</text><text x="1008" y="141" font-size="15" fill="#EEECF3" font-weight="650" text-anchor="start">Execution and log</text><text x="976" y="178" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">by qubesd; stops at</text><text x="976" y="198" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">the first error</text><text x="976" y="224" font-size="13" fill="#C4B5FD" font-weight="600" text-anchor="start">SHA-256 hash-chained log</text><text x="40" y="290" font-size="11" fill="#A39FB0" font-weight="700" text-anchor="start" letter-spacing="1.6">LEVELS, FOR THE PERMANENT AGENT SYS-AGENT (INFLUENCED)</text><rect x="40" y="306" width="1120" height="50" rx="10" fill="#1C1A22"/><rect x="40" y="306" width="4" height="50" rx="2" fill="#8FD3A3"/><text x="64" y="338" font-size="16" fill="#8FD3A3" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">N0</text><text x="118" y="337" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">Read</text><text x="372" y="337" font-size="14.5" fill="#A39FB0" font-weight="400" text-anchor="start">list qubes, states, updates, devices</text><rect x="1089.2" y="318" width="50.8" height="26" rx="13" fill="none" stroke="#8FD3A3" stroke-width="1.5"/><text x="1114.6000000000001" y="336" font-size="13.5" fill="#8FD3A3" font-weight="700" text-anchor="middle">auto</text><rect x="40" y="364" width="1120" height="50" rx="10" fill="#19181F"/><rect x="40" y="364" width="4" height="50" rx="2" fill="#8FD3A3"/><text x="64" y="396" font-size="16" fill="#8FD3A3" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">N1</text><text x="118" y="395" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">On what the agent created</text><text x="372" y="395" font-size="14.5" fill="#A39FB0" font-weight="400" text-anchor="start">create a qube without network, start it, delete it</text><rect x="1089.2" y="376" width="50.8" height="26" rx="13" fill="none" stroke="#8FD3A3" stroke-width="1.5"/><text x="1114.6000000000001" y="394" font-size="13.5" fill="#8FD3A3" font-weight="700" text-anchor="middle">auto</text><rect x="40" y="422" width="1120" height="50" rx="10" fill="#1C1A22"/><rect x="40" y="422" width="4" height="50" rx="2" fill="#C4B5FD"/><text x="64" y="454" font-size="16" fill="#C4B5FD" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">N2</text><text x="118" y="453" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">On your qubes, reversible</text><text x="372" y="453" font-size="14.5" fill="#A39FB0" font-weight="400" text-anchor="start">start, stop, install a package, network for an agent qube</text><rect x="1048.2" y="434" width="91.8" height="26" rx="13" fill="#25223A" stroke="#C4B5FD" stroke-width="1.5"/><text x="1094.1000000000001" y="452" font-size="13.5" fill="#C4B5FD" font-weight="700" text-anchor="middle">confirm</text><rect x="40" y="480" width="1120" height="50" rx="10" fill="#19181F"/><rect x="40" y="480" width="4" height="50" rx="2" fill="#9D7BF4"/><text x="64" y="512" font-size="16" fill="#9D7BF4" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">N3</text><text x="118" y="511" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">Touches isolation</text><text x="372" y="511" font-size="14.5" fill="#A39FB0" font-weight="400" text-anchor="start">network of your qubes, firewall, devices, copy</text><rect x="941.6" y="492" width="198.39999999999998" height="26" rx="13" fill="#2A2438" stroke="#9D7BF4" stroke-width="1.5"/><text x="1040.8" y="510" font-size="13.5" fill="#9D7BF4" font-weight="700" text-anchor="middle">reinforced confirmation</text><rect x="40" y="538" width="1120" height="50" rx="10" fill="#1C1A22"/><rect x="40" y="538" width="4" height="50" rx="2" fill="#F09A8A"/><text x="64" y="570" font-size="16" fill="#F09A8A" font-weight="800" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">N4</text><text x="118" y="569" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">Never</text><text x="372" y="569" font-size="14.5" fill="#A39FB0" font-weight="400" text-anchor="start">dom0, network or input of a vault, QAF infrastructure</text><rect x="1072.8" y="550" width="67.19999999999999" height="26" rx="13" fill="#2A1A1C" stroke="#F09A8A" stroke-width="1.5"/><text x="1106.3999999999999" y="568" font-size="13.5" fill="#F09A8A" font-weight="700" text-anchor="middle">refused</text><text x="40" y="614" font-size="14" fill="#A39FB0" font-weight="400" text-anchor="start">On top of that: an N2+ action on a qube your request does not name becomes a reinforced confirmation.</text></g></svg>
