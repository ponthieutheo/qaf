<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 786" width="1200" height="786" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif" role="img" aria-label="QAF architecture: sys-agent, the Doorman in dom0, qubesd"><title>QAF architecture: sys-agent, the Doorman in dom0, qubesd</title><rect width="1200" height="786" rx="20" fill="#131217"/><g transform="translate(0,-64)"><rect x="32" y="100" width="1136" height="270" rx="16" fill="#17161C" stroke="#353140" stroke-width="1"/><text x="52" y="126" font-size="11" fill="#A39FB0" font-weight="700" text-anchor="start" letter-spacing="1.6">QUBES (XEN VIRTUAL MACHINES)</text><rect x="52" y="142" width="400" height="210" rx="14" fill="#211C2C" stroke="#9D7BF4" stroke-width="2"/><g transform="translate(70,158) scale(1.6)" stroke="#9D7BF4" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2.25" y="5.25" width="11.5" height="8.5" rx="2"/><line x1="8" y1="2.25" x2="8" y2="5.25"/><circle cx="5.75" cy="9.5" r="1.05" fill="#9D7BF4" stroke="none"/><circle cx="10.25" cy="9.5" r="1.05" fill="#9D7BF4" stroke="none"/></g><text x="104" y="178" font-size="18" fill="#9D7BF4" font-weight="700" text-anchor="start">sys-agent</text><text x="434" y="178" font-size="12" fill="#A39FB0" font-weight="400" text-anchor="end">permanent qube</text><rect x="70" y="198" width="170" height="66" rx="10" fill="#25222D" stroke="#353140" stroke-width="1"/><text x="84" y="224" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">Claude Code</text><text x="84" y="247" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">pinned version</text><rect x="256" y="198" width="178" height="66" rx="10" fill="#25222D" stroke="#353140" stroke-width="1"/><text x="270" y="224" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">qaf_mcp</text><text x="270" y="247" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">tools → typed plans</text><text x="70" y="292" font-size="14" fill="#EEECF3" font-weight="400" text-anchor="start">No admin.* rule: it drives Qubes</text><text x="70" y="310" font-size="14" fill="#EEECF3" font-weight="400" text-anchor="start">only through qaf.Plan.</text><text x="70" y="330" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">Always influenced: it reads the Web,</text><text x="70" y="347" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">files, command output.</text><text x="520" y="160" font-size="11" fill="#A39FB0" font-weight="700" text-anchor="start" letter-spacing="1.6">YOUR QUBES AND THE AGENT'S</text><rect x="520" y="174" width="136" height="82" rx="12" fill="#25222D" stroke="#353140" stroke-width="1"/><rect x="520" y="174" width="5" height="82" rx="2.5" fill="#D9A520"/><text x="538" y="200" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">personal</text><text x="538" y="220" font-size="13" fill="#A39FB0" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">qaf_hand</text><text x="538" y="238" font-size="11.5" fill="#6E6A7A" font-weight="400" text-anchor="start">capture, keys, exec</text><rect x="672" y="174" width="136" height="82" rx="12" fill="#25222D" stroke="#353140" stroke-width="1"/><rect x="672" y="174" width="5" height="82" rx="2.5" fill="#4C7DE0"/><text x="690" y="200" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">work</text><text x="690" y="220" font-size="13" fill="#A39FB0" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">qaf_hand</text><text x="690" y="238" font-size="11.5" fill="#6E6A7A" font-weight="400" text-anchor="start">capture, keys, exec</text><rect x="824" y="174" width="136" height="82" rx="12" fill="#25222D" stroke="#353140" stroke-width="1"/><rect x="824" y="174" width="5" height="82" rx="2.5" fill="#D9534F"/><text x="842" y="200" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">untrusted</text><text x="842" y="220" font-size="13" fill="#A39FB0" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">qaf_hand</text><text x="842" y="238" font-size="11.5" fill="#6E6A7A" font-weight="400" text-anchor="start">capture, keys, exec</text><rect x="976" y="174" width="136" height="82" rx="12" fill="#25222D" stroke="#353140" stroke-width="1"/><rect x="976" y="174" width="5" height="82" rx="2.5" fill="#5A5866"/><text x="994" y="200" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">vault</text><text x="994" y="220" font-size="13" fill="#C4B5FD" font-weight="400" text-anchor="start">vault qube</text><text x="994" y="238" font-size="11.5" fill="#6E6A7A" font-weight="400" text-anchor="start">no network, no input</text><rect x="520" y="272" width="592" height="64" rx="12" fill="#25222D" stroke="#353140" stroke-width="1" stroke-dasharray="4 4"/><text x="538" y="298" font-size="15.5" fill="#EEECF3" font-weight="650" text-anchor="start">qaf-dvm disposables</text><text x="538" y="320" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">bounded tasks (qaf.Task) started by dom0, no network</text><path d="M452 215 L512 215" stroke="#F09A8A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="482" cy="215" r="11" fill="#131217" stroke="#F09A8A" stroke-width="1.5"/><path d="M478.5 211.5 L485.5 218.5 M485.5 211.5 L478.5 218.5" stroke="#F09A8A" stroke-width="2" stroke-linecap="round"/><text x="482" y="250" font-size="12.5" fill="#F09A8A" font-weight="600" text-anchor="middle">qrexec</text><text x="482" y="266" font-size="12.5" fill="#F09A8A" font-weight="600" text-anchor="middle">denied</text><rect x="32" y="450" width="1136" height="366" rx="16" fill="#17161C" stroke="#9D7BF4" stroke-width="1.5"/><text x="52" y="476" font-size="11" fill="#C4B5FD" font-weight="700" text-anchor="start" letter-spacing="1.6">DOM0 — NEVER CONNECTED TO THE NETWORK</text><text x="1148" y="476" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="end">Doorman: no LLM, standard Python, capped at 3,420 lines</text><rect x="52" y="496" width="236" height="110" rx="10" fill="#25222D" stroke="#353140" stroke-width="1"/><text x="66" y="522" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">1  qaf.Plan stub</text><text x="66" y="545" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">reads 64 KiB max in 10 s</text><text x="66" y="564" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">no parsing</text><text x="66" y="583" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">passes the raw bytes</text><rect x="328" y="496" width="236" height="110" rx="10" fill="#25222D" stroke="#353140" stroke-width="1"/><text x="342" y="522" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">2  Validator</text><text x="342" y="545" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">dedicated account, no X,</text><text x="342" y="564" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">no sudo, network or qubesd</text><text x="342" y="583" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">closed schema, classification</text><rect x="604" y="496" width="236" height="110" rx="10" fill="#25222D" stroke="#9D7BF4" stroke-width="1.5"/><text x="618" y="522" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">3  Executor</text><text x="618" y="545" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">dedicated account</text><text x="618" y="564" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">requires the canonical plan</text><text x="618" y="583" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">re-classifies: final verdict</text><rect x="880" y="496" width="232" height="110" rx="10" fill="#1F1E24" stroke="#353140" stroke-width="1"/><text x="894" y="522" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">qubesd</text><text x="894" y="545" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">Qubes Admin API</text><text x="894" y="564" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">unmodified</text><path d="M292 551 L322 551" stroke="#9D7BF4" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M315.0 554.8 L322 551 L315.0 547.2" stroke="#9D7BF4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M568 551 L598 551" stroke="#9D7BF4" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M591.0 554.8 L598 551 L591.0 547.2" stroke="#9D7BF4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M844 551 L874 551" stroke="#9D7BF4" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M867.0 554.8 L874 551 L867.0 547.2" stroke="#9D7BF4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="464" y="644" width="250" height="146" rx="10" fill="#25222D" stroke="#C4B5FD" stroke-width="1.5"/><text x="478" y="670" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">Confirmation</text><text x="478" y="693" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">dom0 window, plan</text><text x="478" y="712" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">re-serialized; Allow = A</text><text x="478" y="731" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">on the internal keyboard;</text><text x="478" y="750" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">6-digit code if reinforced</text><rect x="730" y="644" width="230" height="146" rx="10" fill="#25222D" stroke="#353140" stroke-width="1"/><text x="744" y="670" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">Hash-chained log</text><text x="744" y="693" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">one line per event,</text><text x="744" y="712" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">each sealed with the</text><text x="744" y="731" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">SHA-256 of the previous one:</text><text x="744" y="750" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">any edit shows</text><path d="M684 610 L684 640" stroke="#C4B5FD" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M680.2 633.0 L684 640 L687.8 633.0" stroke="#C4B5FD" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M804 610 L804 640" stroke="#6E6A7A" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M800.2 633.0 L804 640 L807.8 633.0" stroke="#6E6A7A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="644" width="290" height="146" rx="10" fill="#25222D" stroke="#353140" stroke-width="1"/><text x="66" y="670" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">You</text><text x="66" y="693" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">you type your request in</text><text x="66" y="712" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">the palette; the executor</text><text x="66" y="731" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">records it, computes its scope</text><text x="66" y="750" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">and passes it to sys-agent</text><path d="M342 690 H404 V626 H628 V612" fill="none" stroke="#A39FB0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M628 622 L628 612" stroke="#A39FB0" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M631.8 619.0 L628 612 L624.2 619.0" stroke="#A39FB0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="414" y="618" font-size="12.5" fill="#A39FB0" font-weight="600" text-anchor="start">request</text><rect x="976" y="644" width="172" height="146" rx="10" fill="#1F1E24" stroke="#353140" stroke-width="1"/><text x="990" y="670" font-size="16" fill="#EEECF3" font-weight="650" text-anchor="start">Helpers</text><text x="990" y="693" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">disposable tasks,</text><text x="990" y="712" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">updates,</text><text x="990" y="731" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">backups,</text><text x="990" y="750" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">with fixed argv</text><path d="M150 352 L150 492" stroke="#9D7BF4" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M146.2 485.0 L150 492 L153.8 485.0" stroke="#9D7BF4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="164" y="404" font-size="14" fill="#C4B5FD" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace">qrexec qaf.Plan</text><text x="164" y="424" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="start">typed JSON plan, never shell</text><path d="M996 492 L996 374" stroke="#6E6A7A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M999.8 381.0 L996 374 L992.2 381.0" stroke="#6E6A7A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="986" y="404" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="end">actions carried out</text><text x="986" y="424" font-size="13.5" fill="#A39FB0" font-weight="400" text-anchor="end">by Qubes itself</text></g></svg>
