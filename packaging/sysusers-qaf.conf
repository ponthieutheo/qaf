# Comptes système du Doorman QAF (systemd-sysusers, /etc/sysusers.d/qaf.conf).
# qaf-gate : validateur, aucun groupe privilégié.
# qaf-exec : exécuteur ; reçoit le groupe qubes par son unité systemd seulement.
u qaf-gate - "QAF Doorman, validateur" - -
u qaf-exec - "QAF Doorman, executeur" - -
# qaf-taches : envoi des tâches aux jetables (qaf.Task) ; groupe qubes par son unité.
u qaf-taches - "QAF Doorman, taches des jetables" - -
# qaf-outils : outils de Qubes à argv fixe (D13) ; groupe qubes par son unité ;
# HOME = /var/lib/qaf-outils (StateDirectory de l'unité, P-2).
u qaf-outils - "QAF Doorman, outils de Qubes" /var/lib/qaf-outils -
# L'exécuteur ouvre son socket au groupe qaf-gate (le validateur) : rien d'autre.
