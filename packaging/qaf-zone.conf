# QAF : qaf-zone à la place de xembedsniproxy dans la session Plasma (X11).
# Posé par packaging/install.sh dans
# /etc/systemd/user/plasma-xembedsniproxy.service.d/50-qaf-zone.conf ; l'unité
# de KDE (/usr/lib/systemd/user/plasma-xembedsniproxy.service) n'est jamais
# modifiée et garde ses dépendances, son ordre et Restart=on-failure.
# qaf-zone republie les icônes XEmbed comme xembedsniproxy, mais les icônes des
# qubes perdent le carré blanc de qubes-gui-agent : encre à la couleur du label
# et trait de label dessous (qaf_ui/zone.py). Les icônes de dom0 sont inchangées.
# Sans qaf-zone (retiré à moitié), ou après 3 échecs dans la session, c'est
# xembedsniproxy d'origine qui tourne.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -x /usr/libexec/qaf/qaf-zone ]; then exec /usr/libexec/qaf/qaf-zone; fi; exec /usr/bin/xembedsniproxy'
