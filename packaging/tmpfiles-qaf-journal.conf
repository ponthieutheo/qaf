# /etc/tmpfiles.d/qaf-journal-lecture.conf — lecture seule du journal du
# portier pour l'utilisateur de la session graphique (panneau qaf-agent,
# docs/ECRANS-QAF.md §9.1). Fichier à nous, posé par install.sh (@UTILISATEUR@
# remplacé), retiré par uninstall.sh avec l'entrée d'ACL.
# - d : le dossier d'état de l'exécuteur, comme StateDirectory (0711 : on le
#   traverse sans le lister) ; rien n'y change s'il existe déjà.
# - f : crée le journal vide s'il manque (un journal vide est valide), garde
#   un journal existant tel quel (propriétaire, 0600).
# - a+ : ajoute une ACL en LECTURE SEULE pour ce seul utilisateur. Personne ne
#   gagne d'écriture ; registre et demandes restent en 0600 sans ACL. Le masque
#   est donné (m::r) : la ligne f remet le mode 0600 à chaque passage, ce qui
#   vide le masque, et a+ ne le recalcule pas si l'entrée existe déjà (parcours 4 :
#   après une mise à jour, « user:user:r-- #effective:--- », fil du panneau vide).
#   group:: reste à --- : le groupe qaf-exec ne gagne rien.
d  /var/lib/qaf-exec                0711 qaf-exec qaf-exec -  -
f  /var/lib/qaf-exec/journal.jsonl  0600 qaf-exec qaf-exec -  -
a+ /var/lib/qaf-exec/journal.jsonl  -    -       -       -  u:@UTILISATEUR@:r,m::r
