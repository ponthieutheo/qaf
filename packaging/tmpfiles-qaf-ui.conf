# /etc/tmpfiles.d/qaf-ui.conf — dossier du socket de la fenêtre de confirmation.
# Propriétaire : l'utilisateur de la session graphique (seul à pouvoir y créer
# le socket) ; groupe qaf-exec (l'exécuteur le traverse, sans rien y créer) ;
# setgid : le socket hérite du groupe qaf-exec, qaf-ui le met en 0660.
# @UTILISATEUR@ est remplacé par install.sh.
d /run/qaf-ui 2750 @UTILISATEUR@ qaf-exec -
